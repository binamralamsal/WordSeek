<!doctype html>
<html lang="en" data-theme-mode="auto">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f5f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <title>WordSeek</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Apply the stored colour scheme before first paint to avoid a flash.
      (() => {
        try {
          const stored = localStorage.getItem("wordseek:theme");
          const telegram = window.Telegram?.WebApp;
          const dark =
            stored === "dark" ||
            (stored !== "light" &&
              (telegram?.colorScheme === "dark" ||
                (!telegram &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches)));
          document.documentElement.classList.toggle("dark", Boolean(dark));
          document.documentElement.dataset.themeMode = stored || "auto";
        } catch {
          // Storage can be unavailable in private browsing; the app re-applies.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
